<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>리모 실시간 긴급 구조 위치</title>
    <!-- 🚨 카카오맵 JavaScript 키 및 닫는 태그 완벽 수정 완료 -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=96e52e03b3c7757340c1bb683e78c7fa"></script>
</head>
<body>
    <div id="map" style="width:100vw; height:100vh;"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const trackingId = urlParams.get('id');

        let map;
        let marker;
        let currentLat;
        let currentLng;

        // 1. 웹페이지가 열리자마자 가장 먼저 실행되는 부분
        if (!trackingId) {
            alert("유효하지 않은 추적 링크입니다.");
        } else {
            // 진짜 위치를 먼저 가져옵니다.
            fetchInitialLocation();
        }

        // 2. 백엔드에서 첫 위치를 가져오는 함수
        function fetchInitialLocation() {
            fetch(`https://api.rimo-app.com/api/tracking/emergency/location/${trackingId}`)
                .then(response => {
                    if (!response.ok) throw new Error("위치 정보 만료 또는 오류");
                    return response.json();
                })
                .then(data => {
                    currentLat = data.lat;
                    currentLng = data.lng;
                    
                    // ⭐️ 진짜 위치를 알아낸 직후에 비로소 지도를 그립니다!
                    initMap(currentLat, currentLng);
                    
                    // 지도가 그려진 이후부터 1초마다 위치 업데이트를 시작합니다.
                    setInterval(updateRealTimeLocation, 1000);
                })
                .catch(error => {
                    console.error('초기 위치 로드 실패:', error);
                    alert("현재 위치 정보를 수신 대기 중이거나 만료된 링크입니다.");
                });
        }

        // 3. 지도를 처음 생성하는 함수
        function initMap(lat, lng) {
            var mapContainer = document.getElementById('map');
            var mapOption = {
                center: new kakao.maps.LatLng(lat, lng), // 알아낸 진짜 위치를 중심점으로 세팅
                level: 3
            };
            
            map = new kakao.maps.Map(mapContainer, mapOption);
            marker = new kakao.maps.Marker({ position: map.getCenter() });
            marker.setMap(map);

            // 마커 클릭 시 카카오내비 길 안내 이벤트
            kakao.maps.event.addListener(marker, 'click', function() {
                if (confirm("이 위치로 길 안내를 시작하시겠습니까?")) {
                    window.location.href = `https://map.kakao.com/link/to/긴급상황위치,${currentLat},${currentLng}`;
                }
            });
        }

// 4. 1초마다 백엔드를 찔러서 마커를 이동시키는 함수
function updateRealTimeLocation() {
    const now = new Date().getTime();
    
    fetch(`https://api.rimo-app.com/api/tracking/emergency/location/${trackingId}?t=${now}`, {
        method: 'GET',
        cache: 'no-store' 
    })
    .then(response => {
        // 서버에서 403이나 404가 와도 (데이터가 잠시 없어도) 화면을 폭파하지 않습니다.
        if (response.status === 403 || response.status === 404) {
            console.warn("데이터 수신 대기 중...");
            return null; 
        }
        if (!response.ok) throw new Error("일시적인 통신 오류");
        return response.json();
    })
    .then(data => {
        if (!data) return; // 데이터가 없으면 오류 없이 다음 1초를 기다림
        
        const currentLat = parseFloat(data.lat);
        const currentLng = parseFloat(data.lng);

        if (!isNaN(currentLat) && !isNaN(currentLng)) {
            var newPosition = new kakao.maps.LatLng(currentLat, currentLng);
            marker.setPosition(newPosition);
            map.panTo(newPosition); 
        }
    })
    .catch(error => {
        // 💡 [핵심] 통신이 끊겨도 절대 alert('만료')나 화면을 끄지 않습니다!
        console.log("통신 재연결 대기 중...");
    });
}
    </script>
</body>
</html>
